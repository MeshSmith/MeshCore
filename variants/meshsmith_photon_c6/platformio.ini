[meshsmith_photon_c6]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_build.partitions = min_spiffs.csv ; get around 4mb flash limit
build_flags =
  ${esp32c6_base.build_flags}
  -I variants/meshsmith_photon_c6
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D P_LORA_TX_LED=15
  -D P_LORA_SCLK=19
  -D P_LORA_MISO=20
  -D P_LORA_MOSI=18
  -D P_LORA_NSS=21
  -D P_LORA_DIO_1=0
  -D P_LORA_BUSY=2
  -D P_LORA_RESET=1
  -D PIN_BOARD_SDA=22
  -D PIN_BOARD_SCL=23
  -D SX126X_RXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=18
  -D DISABLE_WIFI_OTA=1

  -D PIN_GPS_TX=17
  -D PIN_GPS_RX=16
  -D GPS_BAUD_RATE=115200
  -D ENV_SKIP_GPS_DETECT=1
  -D PERSISTANT_GPS=1
  -D ENV_INCLUDE_GPS=1

build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/meshsmith_photon_c6>
  +<XiaoC6Board.cpp>
lib_deps =
  ${esp32c6_base.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/Adafruit INA260 Library @ ^1.5.3
  adafruit/Adafruit SHTC3 Library @ ^1.0.1
  adafruit/Adafruit_VL53L0X @ ^1.2.4
  sensirion/Sensirion I2C SHT4x @ ^1.1.2

[meshsmith_photon_c6_repeater]
extends = meshsmith_photon_c6
build_src_filter = ${meshsmith_photon_c6.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${meshsmith_photon_c6.build_flags}
  -D ADVERT_NAME='"Xiao C6 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${meshsmith_photon_c6.lib_deps}
  ${esp32_ota.lib_deps}

[env:meshsmith_photon_c6_repeater]
extends = meshsmith_photon_c6_repeater

[env:meshsmith_photon_c6_repeater_extant]
extends = meshsmith_photon_c6_repeater
build_flags =
  ${meshsmith_photon_c6_repeater.build_flags}
  -D USE_XIAO_ESP32C6_EXTERNAL_ANTENNA=1

[env:meshsmith_photon_c6_companion_radio_ble]
extends = meshsmith_photon_c6
build_flags = ${meshsmith_photon_c6.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${meshsmith_photon_c6.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${meshsmith_photon_c6.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshsmith_photon_c6_companion_radio_ble_extant]
extends = meshsmith_photon_c6_repeater
build_flags =
  ${meshsmith_photon_c6_repeater.build_flags}
  -D USE_XIAO_ESP32C6_EXTERNAL_ANTENNA=1


[env:meshsmith_photon_c6_kiss_modem]
extends = meshsmith_photon_c6
build_src_filter = ${meshsmith_photon_c6.build_src_filter}
  +<../examples/kiss_modem/>
