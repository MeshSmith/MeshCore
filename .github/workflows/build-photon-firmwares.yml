name: Build Photon Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create, for example photon-v1.0.0'
        required: true
        type: string
  push:
    tags:
      - 'photon-*'

jobs:
  build-photon-firmwares:
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'photon'
      release_title_prefix: 'Photon Firmware'
      release_tag: ${{ github.event.inputs.release_tag || '' }}
